<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Experiment</title>
  <script src="jspsych-6/jspsych.js"></script>
  <script src="jspsych-6/plugins/jspsych-html-keyboard-response.js"></script>
  <script src="jspsych-6/plugins/jspsych-image-keyboard-response.js"></script>
  <script src="jspsych-6/plugins/jspsych-video-keyboard-response.js"></script>
  <script src="jspsych-6/plugins/jspsych-survey-html-form.js"></script>
  <script src="jspsych-6/plugins/jspsych-survey-multi-select.js"></script>
  <script src="jspsych-6/plugins/jspsych-fullscreen.js"></script>
  <script src="jspsych-6/plugins/hammer.min.js"></script>
  <link href="jspsych-6/css/jspsych.css" rel="stylesheet" type="text/css">

  <!-- jQuery -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"
    integrity="sha256-VazP97ZCwtekAsvgPBSUwPFKdrwD3unUfSGVYrahUqU=" crossorigin="anonymous"></script>

  <!-- css -->
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
  <link href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css" rel="stylesheet" type="text/css">

  <!-- custom scripts -->
  <script src="jspsych-6/plugins/demo-html-keyboard-response.js"></script> <!-- custom keyboard plugin used for instructions/trials -->
  <script src="jspsych-6/plugins/demo-animate-discs.js"></script> <!--legacy, not used-->
  <script src="jspsych-6/plugins/demo-html-button-response.js"></script> <!-- custom button plugin used for UCLA survey -->
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #ffffff;
      margin: 0;
      overflow-y: scroll;
      overflow-x: hidden;
    }

    /* Container splits the screen into two halves around the fixation cross */
    .memory-shape-name-trial.stimulus-container {
      display: flex; /* use flexbox so rows share vertical space */
      flex-direction: column; /* stack top/bottom rows */
      justify-content: center; /* keep rows centered vertically */
      height: 100%; /* fill the entire viewport height */
      width: 100%; /* fill the entire viewport width */
    }

    .memory-shape-name-row {
      flex: 1; /* each row takes half the container height */
      display: flex; /* align label/shape within the row */
      justify-content: center; /* center content horizontally */
    }

    .memory-shape-name-row.top-row {
      align-items: flex-end; /* push top row content toward the center */
      padding-bottom: 40px; /* gap between label/shape and fixation */
    }

    .memory-shape-name-row.bottom-row {
      align-items: flex-start; /* push bottom row content toward the center */
      padding-top: 40px; /* gap between label/shape and fixation */
    }

    .shape-figure {
      display: flex; /* center the CSS shape */
      align-items: center; /* vertical center */
      justify-content: center; /* horizontal center */
    }

    .shape-circle,
    .shape-square {
      width: 160px; /* width of circle/square stimulus */
      height: 160px; /* height of circle/square stimulus */
      background: #000; /* solid black fill */
    }

    .shape-circle {
      border-radius: 50%; /* turn square div into a circle */
    }

    .shape-triangle {
      width: 0; /* use borders to draw triangle */
      height: 0;
      border-left: 80px solid transparent; /* left side of triangle */
      border-right: 80px solid transparent; /* right side of triangle */
      border-bottom: 160px solid #000; /* base color/size of triangle */
    }

    .memory-shape-name-text {
      font-size: 52px; /* label height (approx 1.6째 visual angle) */
      font-weight: 600; /* bold text for readability */
      letter-spacing: 2px; /* add spacing to uppercase text */
    }

    /* Instruction mapping cards stay responsive but capped for readability */
    .mapping-grid {
      display: flex; /* lay out cards in a row */
      justify-content: center; /* center the row on the page */
      gap: 40px; /* spacing between cards */
      flex-wrap: wrap; /* wrap to new lines on small screens */
      margin-top: 30px; /* space above the grid */
    }

    .mapping-card {
      border: 2px solid #000; /* outline each mapping card */
      border-radius: 12px; /* rounded corners */
      padding: 20px 30px;  /* internal spacing */
      width: 260px; /* fixed card width */
      text-align: center; /* center text/content */
      background: #fdfdfd; /* light background for contrast */
    }

    .mapping-card h3 {
      margin-bottom: 16px; /* space below the heading */
      font-size: 24px; /* heading size */
      text-transform: uppercase; /* match style of labels */
      letter-spacing: 1px; /* add some spacing between letters */
    }

    #phase-indicator-badge .phase-badge-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }

    #phase-indicator-badge .phase-key-legend {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11px;
      color: #f2f2f2;
    }

    #phase-indicator-badge .phase-key-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #phase-indicator-badge .phase-keycap {
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 9px;
      padding: 2px 8px;
      min-width: 28px;
      text-align: center;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.05);
    }
  </style>
</head>

<body>
    <footer>
        <script src="exp/params.js"></script>
        <script src="exp/core.js"></script>
        <script src="exp/timeline.js"></script>
        <script src="exp/run.js"></script>
        <script src="exp/var.js"></script>
    </footer>
</body>

</html>
